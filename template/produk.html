<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Data Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen">
    <aside class="w-64 bg-slate-800 text-white p-5 space-y-2">
        <h2 class="text-lg font-bold mb-6">POS Material</h2>
        <a href="/transaksi" class="block p-3 rounded hover:bg-slate-700">Transaksi Kasir</a>
        <a href="/produk" class="block p-3 rounded bg-amber-600 font-bold">Data Produk</a>
        <a href="/laporan-produk" class="block p-3 rounded hover:bg-slate-700">Report Produk</a>
        <a href="/laporan-transaksi" class="block p-3 rounded hover:bg-slate-700">Report Transaksi</a>
        <a href="/" class="block p-3 rounded bg-red-600 mt-10">Logout</a>
    </aside>
    <main class="flex-1 p-6">
        <h1 class="text-2xl font-bold mb-4">Manajemen Data Produk Material</h1>
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-200 text-sm">
                    <tr><th class="p-3">Barcode</th><th class="p-3">Nama Produk</th><th class="p-3">Satuan</th><th class="p-3">Harga Jual</th><th class="p-3">Stok</th></tr>
                </thead>
                <tbody id="tbl-produk" class="text-sm divide-y"></tbody>
            </table>
        </div>
    </main>
    <script>
        fetch('/api/produk').then(res => res.json()).then(data => {
            let html = '';
            data.forEach(p => {
                html += `<tr><td class="p-3 font-mono">${p.barcode || '-'}</td><td class="p-3 font-bold">${p.nama_produk}</td><td class="p-3">${p.satuan}</td><td class="p-3">Rp ${p.harga_jual.toLocaleString()}</td><td class="p-3">${p.stok}</td></tr>`;
            });
            document.getElementById('tbl-produk').innerHTML = html;
        });
    </script>
</body>
</html>
