<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Toko Material POS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center brand-icon mx-auto mb-3" style="width: 52px; height: 52px; border-radius: 12px;">
        <i class="bi bi-box-seam-fill fs-3"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">TOKO MATERIAL</h3>
      <p class="text-muted small">Solusi Bangunan Anda - Sistem Kasir & Stok</p>
    </div>

    <form action="produk.html" method="GET">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" class="form-control border-start-0" placeholder="Masukkan username" value="admin" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control border-start-0" placeholder="••••••••" value="password123" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Masuk Sebagai</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-shield-check"></i>
          </span>
          <select class="form-select border-start-0">
            <option value="admin" selected>Administrator</option>
            <option value="kasir">Kasir</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-muted" for="rememberMe">Ingat Saya</label>
        </div>
        <a href="#" class="small text-decoration-none text-primary fw-semibold">Lupa Password?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-box-arrow-in-right me-2"></i>Masuk ke Sistem
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <small class="text-muted">© 2024 Toko Material POS. Hak Cipta Dilindungi.</small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
