<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - POS Material</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Login POS Material</h2>
        <form action="/transaksi" method="GET">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500" placeholder="admin / kasir">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500" placeholder="******">
            </div>
            <button type="submit" class="w-full bg-amber-600 text-white font-bold py-2 rounded-lg hover:bg-amber-700">Masuk</button>
        </form>
    </div>
</body>
</html>
