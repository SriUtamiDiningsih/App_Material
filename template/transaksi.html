<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasir & Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-slate-800 text-white p-5 space-y-2">
            <h2 class="text-lg font-bold mb-6"><i class="fa-solid fa-warehouse"></i> POS Material</h2>
            <a href="/transaksi" class="block p-3 rounded bg-amber-600 font-bold"><i class="fa-solid fa-cash-register"></i> Transaksi Kasir</a>
            <a href="/produk" class="block p-3 rounded hover:bg-slate-700"><i class="fa-solid fa-box"></i> Data Produk</a>
            <a href="/laporan-produk" class="block p-3 rounded hover:bg-slate-700"><i class="fa-solid fa-file-excel"></i> Report Produk</a>
            <a href="/laporan-transaksi" class="block p-3 rounded hover:bg-slate-700"><i class="fa-solid fa-file-excel"></i> Report Transaksi</a>
            <a href="/user" class="block p-3 rounded hover:bg-slate-700"><i class="fa-solid fa-users"></i> Data Pengguna</a>
            <a href="/" class="block p-3 rounded bg-red-600 font-bold mt-10"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </aside>
        <main class="flex-1 p-6 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-4">Kasir Penjualan Material (Scanner)</h1>
            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-2 bg-white p-5 rounded-xl shadow">
                    <label class="block text-xs font-bold text-gray-600 mb-1">SCAN BARCODE / KETIK KODE</label>
                    <input type="text" id="barcode-input" placeholder="Scan barcode produk lalu tekan Enter..." class="w-full border px-4 py-2 rounded-lg mb-4" autofocus onkeypress="handleScan(event)">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-xs">
                            <tr><th class="p-2">Produk</th><th class="p-2">Harga</th><th class="p-2">Qty</th><th class="p-2">Subtotal</th></tr>
                        </thead>
                        <tbody id="cart-body" class="text-sm divide-y"></tbody>
                    </table>
                </div>
                <div class="bg-white p-5 rounded-xl shadow flex flex-col justify-between">
                    <div>
                        <h2 class="font-bold mb-4">Ringkasan Pembayaran</h2>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span>Subtotal:</span> <span id="lbl-subtotal">Rp 0</span></div>
                            <div class="flex justify-between"><span>Pajak (11%):</span> <span id="lbl-pajak">Rp 0</span></div>
                            <div class="flex justify-between text-lg font-bold border-t pt-2"><span>Total:</span> <span id="lbl-total" class="text-amber-600">Rp 0</span></div>
                        </div>
                    </div>
                    <button onclick="checkout()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700"><i class="fa-solid fa-print"></i> Bayar & Cetak Struk</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        let cart = [];
        let allProduks = [];
        async function loadProduk() {
            let res = await fetch('/api/produk');
            allProduks = await res.json();
        }
        loadProduk();

        function handleScan(e) {
            if (e.key === 'Enter') {
                let code = e.target.value.trim();
                let prod = allProduks.find(p => p.barcode === code);
                if (prod) {
                    cart.push({ produk_id: prod.produk_id, nama_produk: prod.nama_produk, harga_satuan: prod.harga_jual, qty: 1 });
                    renderCart();
                    e.target.value = '';
                } else {
                    alert('Produk tidak ditemukan!');
                }
            }
        }

        function renderCart() {
            let html = '', sub = 0;
            cart.forEach(i => {
                let t = i.harga_satuan * i.qty;
                sub += t;
                html += `<tr><td class="p-2">${i.nama_produk}</td><td class="p-2">Rp ${i.harga_satuan.toLocaleString()}</td><td class="p-2">${i.qty}</td><td class="p-2 font-bold">Rp ${t.toLocaleString()}</td></tr>`;
            });
            document.getElementById('cart-body').innerHTML = html;
            let pajak = sub * 0.11;
            document.getElementById('lbl-subtotal').innerText = 'Rp ' + sub.toLocaleString();
            document.getElementById('lbl-pajak').innerText = 'Rp ' + pajak.toLocaleString();
            document.getElementById('lbl-total').innerText = 'Rp ' + (sub + pajak).toLocaleString();
        }

        async function checkout() {
            if (cart.length === 0) return alert('Keranjang kosong!');
            let res = await fetch('/api/checkout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: 1, metode_pembayaran: 'Tunai', details: cart })
            });
            let result = await res.json();
            if (res.ok) {
                alert(result.message);
                window.print();
                cart = [];
                renderCart();
            } else {
                alert(result.error);
            }
        }
    </script>
</body>
</html>
